[project]
name = "tradeflow"
version = "0.1.0"
description = "TradeFlow - análise e automação de trading com IA"
requires-python = ">=3.11,<3.13"
dependencies = [
    # --- Configuração e validação ---
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    # --- LLM / Agentes ---
    "openai",
    "langchain",
    "langchain-openai",
    "langchain-community",
    "crewai",
    # --- Extração de documentos ---
    "pdfplumber",
    "pytesseract",
    # --- RAG / Vector Store ---
    # chromadb (Fase U3) — crewai 1.15 fixa chromadb<1.2 (1.1.1); 1.5.x rebaixaria o crewai
    "chromadb",
    # --- Análise preditiva ---
    "pandas",
    "scikit-learn",
    "joblib",
    # --- Banco relacional ---
    "sqlalchemy",
    "alembic",
    "psycopg2-binary",
    # --- API ---
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "slowapi",
    # --- Interface ---
    "streamlit",
    "pypdf",
]

[dependency-groups]
dev = [
    "ruff",
    "black",
    "pytest",
    "pip-audit",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
