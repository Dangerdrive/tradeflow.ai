[project]
name = "tradeflow"
version = "0.1.0"
description = "TradeFlow - análise e automação de trading com IA"
requires-python = ">=3.11,<3.14"
dependencies = [
    # --- Configuração e validação ---
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    # --- LLM / Agentes ---
    "openai==1.35.13",
    "langchain==0.2.7",
    "langchain-openai==0.1.12",
    "langchain-community==0.2.7",
    "crewai==0.41.0",
    # --- Extração de documentos ---
    "pdfplumber",
    "pytesseract==0.3.10",
    # --- RAG / Vector Store ---
    # chromadb <0.5.0 é exigido pela dependência embedchain do crewai
    "chromadb<0.5.0",
    # --- Análise preditiva ---
    "pandas",
    "scikit-learn",
    "joblib",
    # --- Banco relacional ---
    "sqlalchemy",
    "alembic",
    "psycopg2-binary",
    # --- API ---
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "slowapi",
    # --- Interface ---
    "streamlit",
    "pypdf>=4.3.1",
]

[dependency-groups]
dev = [
    "ruff",
    "black",
    "pytest",
    "pip-audit",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
