[project]
name = "tradeflow"
version = "0.1.0"
description = "TradeFlow - análise e automação de trading com IA"
requires-python = ">=3.11"
dependencies = [
    # --- Configuração e validação ---
    "pydantic==2.7.4",
    "pydantic-settings==2.3.4",
    "python-dotenv==1.0.1",
    # --- LLM / Agentes ---
    "openai==1.35.13",
    "langchain==0.2.7",
    "langchain-openai==0.1.12",
    "langchain-community==0.2.7",
    "crewai==0.41.0",
    # --- Extração de documentos ---
    "pdfplumber==0.11.2",
    "PyPDF2==3.0.1",
    "pytesseract==0.3.10",
    # --- RAG / Vector Store ---
    # chromadb <0.5.0 é exigido pela dependência embedchain do crewai
    "chromadb<0.5.0",
    # --- Análise preditiva ---
    "pandas==2.2.2",
    "scikit-learn==1.5.1",
    "joblib==1.4.2",
    # --- Banco relacional ---
    "sqlalchemy==2.0.31",
    "alembic==1.13.2",
    "psycopg2-binary==2.9.9",
    # --- API ---
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "python-multipart==0.0.9",
    "slowapi==0.1.9",
    # --- Interface ---
    "streamlit==1.36.0",
]

[dependency-groups]
dev = [
    "ruff",
    "black",
    "pytest",
    "pip-audit",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
