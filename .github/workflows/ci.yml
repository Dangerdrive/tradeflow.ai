name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      # Os comandos usam `uv run` porque o setup-uv não ativa o venv por padrão
      # (activate-environment=false), então `ruff`/`black`/`pytest`/`pip-audit`
      # não ficam no PATH do runner.

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (black)
        run: uv run black --check .

      - name: Tests
        run: uv run pytest
        # O scan de segredos é coberto por tests/test_seguranca.py (pytest),
        # que roda nesta etapa: .env não versionado, sem segredos reais nos
        # arquivos rastreados e logs sem PII por padrão. (A action gitleaks
        # de terceiros foi removida por falhas de infraestrutura intermitentes.)

      - name: Security audit (pip-audit)
        # PYSEC-2026-311 (chromadb) é aceita e documentada: sem versão fix
        # publicada até 2026-08-13. Reavaliar a cada upgrade.
        run: uv run pip-audit --ignore-vuln PYSEC-2026-311
